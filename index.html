<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM PROXI</title>
  <style>
    :root {
      --bg: #1c1917;
      --card: #111827;
      --card-soft: #0f172a;
      --accent: #f97316;
      --accent-soft: rgba(248, 148, 56, 0.18);
      --text: #f9fafb;
      --muted: #e5e7eb;
      --border: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(248, 148, 56, 0.35), transparent 55%),
        radial-gradient(circle at bottom right, rgba(34,197,94,0.22), transparent 55%),
        linear-gradient(145deg, #0b1120, #111827);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .app-shell {
      width: 100%;
      max-width: 1400px;
      display: flex;
      gap: 16px;
      padding: 16px;
    }
    .card {
      background: linear-gradient(145deg, rgba(15,23,42,0.96), rgba(15,23,42,0.9));
      border-radius: 18px;
      padding: 18px 20px;
      border: 1px solid rgba(249,250,251,0.08);
      box-shadow: 0 18px 50px rgba(15,23,42,0.9);
    }
    .sidebar { width: 260px; display: flex; flex-direction: column; gap: 12px; }
    .main { flex: 1; display: flex; flex-direction: column; gap: 16px; }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 9px; height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #fed7aa, #f97316);
      box-shadow: 0 0 18px rgba(248,148,56,0.9);
    }
    .subtext { font-size: 13px; color: var(--muted); opacity: .85; }
    .login-card { width: 100%; max-width: 420px; margin: auto; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--muted); opacity: .9; }
    select, input, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15,23,42,0.9);
      color: var(--text);
      font-size: 13px;
      resize: vertical;
    }
    select:focus, input:focus, textarea:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      background: radial-gradient(circle at 30% 0, #fed7aa, #f97316);
      color: #1c1917;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 30px rgba(248,148,56,0.55);
    }
    button.secondary {
      background: transparent;
      color: var(--muted);
      box-shadow: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .commercial-row {
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15,23,42,0.88);
      border: 1px solid transparent;
    }
    .commercial-row.active { border-color: var(--accent); background: rgba(248,148,56,0.14); }
    .commercial-row:hover { border-color: rgba(249,250,251,0.32); }
    .commercial-name { font-size: 14px; }
    .commercial-meta { font-size: 11px; color: var(--muted); opacity: .8; }
    .list { margin-top: 10px; max-height: calc(100vh - 230px); overflow: auto; }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .kpi-card {
      padding: 10px 12px;
      border-radius: 14px;
      background: radial-gradient(circle at 0 0, rgba(248,148,56,0.16), rgba(15,23,42,0.98));
      border: 1px solid rgba(249,250,251,0.14);
      font-size: 12px;
    }
    .kpi-label { color: var(--muted); font-size: 11px; opacity:.9; }
    .kpi-value { font-size: 17px; font-weight: 600; margin-top: 3px; }

    .tabs {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(249,250,251,0.2);
    }
    .tab-btn {
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(248,148,56,0.9);
      color: #1c1917;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(31,41,55,0.9);
      text-align: left;
      vertical-align: top;
    }
    th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; opacity:.8; }
    tr:hover td { background: rgba(15,23,42,0.9); cursor: pointer; }

    .two-columns {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 12px;
      margin-top: 10px;
      align-items: flex-start;
    }

    @media (max-width: 900px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; }
      .two-columns { grid-template-columns: minmax(0,1fr); }
      .kpi-row { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    .chart-grid{
  display:grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap:12px;
  margin-top:12px;
}
.chart-card{
  background: rgba(15,23,42,0.7);
  border: 1px solid rgba(249,250,251,0.12);
  border-radius: 14px;
  padding: 12px;
}
.chart-title{
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}
.chart-wrap{
  position: relative;
  height: 320px;
}
@media (max-width: 900px){
  .chart-grid{ grid-template-columns: 1fr; }
  .chart-wrap{ height: 240px; }
}

/* --- Détention : SCORE plus visible --- */
th.score-cell, td.score-cell{
  text-align: right;
  font-weight: 800;
}

td.score-cell{
  font-size: 13px;
  background: rgba(248,148,56,0.10);
  border-left: 1px solid rgba(248,148,56,0.25);
}

td.score-cell b{
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(248,148,56,0.18);
}
  

/* --- GLOBAL SAVE STATUS --- */
.topbar{
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  margin-bottom: 12px;
  border-radius: 16px;
  border: 1px solid rgba(249,250,251,0.10);
  background: rgba(15,23,42,0.72);
  backdrop-filter: blur(10px);
}

.save-status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  border:1px solid rgba(249,250,251,0.14);
}

.save-status[data-status="saving"]{
  background: rgba(248,148,56,0.16);
  border-color: rgba(248,148,56,0.28);
}

.save-status[data-status="saved"]{
  background: rgba(34,197,94,0.14);
  border-color: rgba(34,197,94,0.28);
}

.save-status[data-status="error"]{
  background: rgba(248,113,113,0.14);
  border-color: rgba(248,113,113,0.28);
}

function safeCalcExpression(expr){
  const s = String(expr).replace(/\s+/g, "");
  // Autorise uniquement chiffres + . + + -
  if (!/^[0-9.+-]+$/.test(s)) return NaN;

  // "2250+1000-200" => ["2250","+1000","-200"]
  const parts = s.match(/[+-]?\d+(\.\d+)?/g);
  if (!parts) return NaN;

  return parts.reduce((sum, p) => sum + Number(p), 0);
}


    function computeFLProgression(actual, target) {
  const t = Number(target || 0);
  const a = Number(actual || 0);

  // Aucun objectif défini
  if (t === 0) {
    if (a === 0) return "0 %";
    return "100 %";
  }

  return Math.round((a / t) * 100) + " %";
}

    function normalizeFlData(any) {
  if (!any || typeof any !== "object") {
    return {
      meta: { commande: "", months2026: { ...FL_EMPTY_MONTHS } },
      seasons: defaultFlBySeason()
    };
  }

  // format { meta, seasons }
  if (any.seasons && typeof any.seasons === "object") {
    const meta = (any.meta && typeof any.meta === "object") ? any.meta : {};
    return {
      meta: {
        commande: meta.commande || "",
        months2026: meta.months2026 && typeof meta.months2026 === "object"
          ? { ...FL_EMPTY_MONTHS, ...meta.months2026 }
          : { ...FL_EMPTY_MONTHS }
      },
      seasons: ensureAllSeasons(any.seasons)
    };
  }

  // ancien format (seasons direct)
  return {
    meta: { commande: "", months2026: { ...FL_EMPTY_MONTHS } },
    seasons: ensureAllSeasons(any)
  };
}

    function ensureAllSeasons(obj) {
      const base = defaultFlBySeason();
      const out = { ...base };
      SEASONS.forEach(s => {
        const d = obj?.[s];
        if (d && typeof d === "object") {
          out[s] = {
            ordered: d.ordered ?? "",
amount: d.amount ?? "",
plan: d.plan ?? ""
          };
        }
      });
      return out;
    }

    function normalizeEngagementByWave(raw) {
      const base = defaultEngagementByWave();
      if (!raw || typeof raw !== "object") return base;
      Object.keys(base).forEach(waveId => {
        if (!raw[waveId] || typeof raw[waveId] !== "object") {
          raw[waveId] = { name: "", amount: "" };
        } else {
          raw[waveId].name = raw[waveId].name || "";
          raw[waveId].amount = raw[waveId].amount || "";
        }
      });
      return raw;
    }

    function normalizeVisits(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(v =>
    typeof v === "string"
      ? { date: v, note: "" }
      : { date: v.date, note: v.note || "" }
  );
}

function computePromoPercent(store, month) {

  if (!list.length) return "—";
  const state = getPromoState(store.id, month);
  const ordered = list.filter(p => state[p.id]?.checked).length;
  return Math.round((ordered / list.length) * 100);
}

        flActual: 0,

    map[cid].flTarget += toNum(r.flTarget);

        if (currentCommercialFilter) return STORES.filter(s => s.commercialId === currentCommercialFilter);
        return STORES;
      }
      return STORES.filter(s => s.commercialId === user.id);
    }

    function computeKpis(user) {
      const stores = getUserStores(user);
      const totalStores = stores.length;
      const totalCA = stores.reduce((sum, s) => sum + (s.ca2024 || 0), 0);
      let engagedStores = 0;
      stores.forEach(s => {
        const st = getStoreState(s.id);
        const hasEng = WAVES.some(w => st.waves[w.id] === "Engagé");
        if (hasEng) engagedStores++;
      });
      const avgCA = totalStores ? Math.round(totalCA / totalStores) : 0;
      return { totalStores, totalCA, avgCA, engagedStores };
    }

    function computeFlKpis(user) {
      const stores = getUserStores(user);
      let totalTarget = 0;
      let totalActual = 0;
      stores.forEach(s => {
        totalTarget += getFlTarget(s.id);
        totalActual += computeFLActualTotal(s.id);
      });
      const progression = computeFLProgression(totalActual, totalTarget);
      return { totalTarget, totalActual, progression };
    }

function getLastVisitDate(storeId){
  const st = getStoreState(storeId);
  const visits = Array.isArray(st.visits) ? st.visits : [];
  const dates = visits.map(v => (typeof v === "string" ? v : v?.date)).filter(Boolean).sort();
  return dates.length ? dates[dates.length - 1] : "";
}

function getEngagedWavesCount(storeId){
  const st = getStoreState(storeId);
  return WAVES.filter(w => st.waves?.[w.id] === "Engagé").length;
}

function computePilotRow(store, promoMonth, detentionPeriod){
  const st = getStoreState(store.id);

  const lastVisit = getLastVisitDate(store.id);
  const visitsCount = Array.isArray(st.visits) ? st.visits.length : 0;

  const engagedWaves = getEngagedWavesCount(store.id);
  const engagedTotal = computeEngagementTotal(store.id);

  const flActual = computeFLActualTotal(store.id);
  const flTarget = getFlTarget(store.id);
  const flPct = (Number(flTarget || 0) > 0)
    ? Math.round((Number(flActual || 0) / Number(flTarget)) * 100)
    : (flActual > 0 ? 100 : 0);

  const promoPct = computePromoPercent(store, promoMonth);

  const det = getDetentionState(store.id, detentionPeriod);
  const detAvg = Math.round((Number(det.rangA||0)+Number(det.top200||0)+Number(det.top300||0)+Number(det.bio||0))/4);
  const detHas = det.rangA || det.top200 || det.top300 || det.bio;
  const detentionAvg = detHas ? detAvg : "";

  return {
    id: store.id,
    storeName: store.name,
    commercialId: store.commercialId,
    commercialName: getCommercialName(store.commercialId),
    ca: Number(store.ca2024 || 0),

    lastVisit,
    visitsCount,

    engagedWaves,
    engagedTotal,

    flActual,
    flTarget,
    flPct,

    promoPct,          // number or "—"
    detentionAvg       // number or ""
  };
}

function computeAdminPilotData(){
  const promoMonth = (typeof currentPromoMonth === "string" && currentPromoMonth) ? currentPromoMonth : "2026-01";
  const detentionPeriod = (typeof currentDetentionPeriod === "string" && currentDetentionPeriod) ? currentDetentionPeriod : "2025-11_2026-01";

  let rows = STORES.map(s => computePilotRow(s, promoMonth, detentionPeriod));

  const filterCommercial = currentCommercialFilter || adminPilotCommercial;
if (filterCommercial) rows = rows.filter(r => r.commercialId === filterCommercial);

  if (adminPilotSearch.trim()){
    const q = adminPilotSearch.trim().toLowerCase();
    rows = rows.filter(r =>
      r.storeName.toLowerCase().includes(q) ||
      r.commercialName.toLowerCase().includes(q)
    );
  }

  const { key, dir } = adminPilotSort || { key: "lastVisit", dir: "asc" };
  const mult = dir === "desc" ? -1 : 1;

  rows.sort((a,b) => {
    const va = a[key];
    const vb = b[key];

    if (key === "lastVisit") return (String(va||"").localeCompare(String(vb||""))) * mult;

    if (key === "promoPct"){
      const na = typeof va === "number" ? va : -1;
      const nb = typeof vb === "number" ? vb : -1;
      return (na - nb) * mult;
    }

    const na = Number(va ?? 0);
    const nb = Number(vb ?? 0);
    return (na - nb) * mult;
  });

  const totalStores = rows.length;
  const totalCA = rows.reduce((s,r)=> s + (r.ca||0), 0);

  const totalFlActual = rows.reduce((s,r)=> s + (r.flActual||0), 0);
  const totalFlTarget = rows.reduce((s,r)=> s + (r.flTarget||0), 0);
  const flProgress = computeFLProgression(totalFlActual, totalFlTarget);

  const totalVisits = rows.reduce((s,r)=> s + (r.visitsCount||0), 0);
  const engagedStores = rows.filter(r => r.engagedWaves > 0).length;

  return {
    promoMonth,
    detentionPeriod,
    rows,
    kpis: { totalStores, totalCA, totalFlActual, totalFlTarget, flProgress, totalVisits, engagedStores }
  };
}

function setAdminPilotSort(key){
  if (adminPilotSort.key === key){
    adminPilotSort.dir = adminPilotSort.dir === "asc" ? "desc" : "asc";
  } else {
    adminPilotSort.key = key;
    adminPilotSort.dir = "asc";
  }
  renderApp();
}

const amountInput = right.querySelector("#seasonAmount");

amountInput.addEventListener("change", function () {
  const txt = this.value.trim();

  // si vide → on met 0
  if (!txt) {
    st.flBySeason[currentFlSeason].amount = 0;
    this.value = "";
    updateFlKpisLive(currentStore.id);
    saveWithDebounce(currentStore.id);
    return;
  }

  const current = Number(st.flBySeason[currentFlSeason].amount || 0);
  let result;

  // CAS 1 : commence par + ou -
  if (txt.startsWith("+") || txt.startsWith("-")) {
  const delta = safeCalcExpression(txt); // gère +1000-200 etc.
  result = current + delta;
}
  // CAS 2 : expression du type 2250+1000-200
  else if (txt.includes("+") || txt.includes("-")) {
    result = safeCalcExpression(txt);
  }
  // CAS 3 : valeur simple → remplace
  else {
    result = Number(txt);
  }

  if (Number.isNaN(result)) return;

  st.flBySeason[currentFlSeason].amount = result;
  this.value = result;

  updateFlKpisLive(currentStore.id);
  saveWithDebounce(currentStore.id);
});

function detentionColor(v){
  return "";
}

function getDetentionState(storeId, period) {
  const st = getStoreState(storeId);

  if (!st.detentionByPeriod[period]) {
    st.detentionByPeriod[period] = {
      rangA: "",
      top200: "",
      top300: "",
      bio: ""
    };
  }

  return st.detentionByPeriod[period];
}

function renderDetentionTab(container, stores, currentStore){
    container.innerHTML = "";

  const left = document.createElement("div");
  const right = document.createElement("div");

  left.innerHTML = `
    <div style="font-size:13px;font-weight:600;margin-bottom:8px;">
      Détention · ${currentDetentionPeriod}
    </div>

    <table>
      <thead>
        <tr>
          <th>Magasin</th>
          <th>Rang A</th>
          <th>TOP200</th>
          <th>TOP300</th>
          <th>BIO</th>
          <th class="score-cell">Score</th>
        </tr>
      </thead>
      <tbody>
        ${[...stores]
.sort((a,b)=>{
  const da = getDetentionState(a.id,currentDetentionPeriod);
  const db = getDetentionState(b.id,currentDetentionPeriod);

  const avgA = (Number(da.rangA||0)+Number(da.top200||0)+Number(da.top300||0)+Number(da.bio||0))/4;
  const avgB = (Number(db.rangA||0)+Number(db.top200||0)+Number(db.top300||0)+Number(db.bio||0))/4;

  const hasDataA = da.rangA||da.top200||da.top300||da.bio;
  const hasDataB = db.rangA||db.top200||db.top300||db.bio;

  if(!hasDataA && !hasDataB) return 0;
  if(!hasDataA) return 1;
  if(!hasDataB) return -1;

  return avgB - avgA;
})
.map(s=>{
  const d = getDetentionState(s.id,currentDetentionPeriod);

  const avg = Math.round(
    (
      Number(d.rangA||0)+
      Number(d.top200||0)+
      Number(d.top300||0)+
      Number(d.bio||0)
    ) / 4
  );

  const hasData = d.rangA||d.top200||d.top300||d.bio;

  return `
  <tr data-id="${s.id}">
    <td>${s.name}</td>
    <td>${d.rangA||0}%</td>
    <td>${d.top200||0}%</td>
    <td>${d.top300||0}%</td>
    <td>${d.bio||0}%</td>
    <td class="score-cell"><b>${hasData ? (avg + "%") : "—"}</b></td>
  </tr>`;
}).join("")}
      </tbody>
    </table>
  `;

  left.querySelectorAll("tr[data-id]").forEach(tr=>{
    tr.onclick = ()=>{
      currentStoreId = tr.dataset.id;
      renderApp();
    }
  });

  if(!currentStore){
    container.appendChild(left);
    return;
  }

  const d = getDetentionState(currentStore.id,currentDetentionPeriod);

  right.innerHTML = `
    <div style="font-size:13px;font-weight:600;margin-bottom:10px;">${currentStore.name}</div>

    <label>Rang A PGC</label>
${currentUser.role === "admin"
  ? `<input type="number" value="${d.rangA||""}" data-det="rangA">`
  : `<div>${detentionColor(d.rangA)} ${d.rangA||0}%</div>`
}

<label>TOP 200 MDC</label>
${currentUser.role === "admin"
  ? `<input type="number" value="${d.top200||""}" data-det="top200">`
  : `<div>${detentionColor(d.top200)} ${d.top200||0}%</div>`
}

<label>TOP 300 MN</label>
${currentUser.role === "admin"
  ? `<input type="number" value="${d.top300||""}" data-det="top300">`
  : `<div>${detentionColor(d.top300)} ${d.top300||0}%</div>`
}

<label>TOP BIO MDC</label>
${currentUser.role === "admin"
  ? `<input type="number" value="${d.bio||""}" data-det="bio">`
  : `<div>${detentionColor(d.bio)} ${d.bio||0}%</div>`
}
  `;

  if (currentUser.role === "admin") {
  right.querySelectorAll("[data-det]").forEach(inp=>{
    inp.onblur = ()=>{
      d[inp.dataset.det] = Number(inp.value||0);
      saveWithDebounce(currentStore.id);
      renderApp();
    }
  });
}

container.appendChild(left);
container.appendChild(right);
}
